<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ballot — quick polls</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FAF8F3;
    --paper-dim:#F1EEE5;
    --ink:#211F1B;
    --ink-soft:#8A8477;
    --line:#DEDACC;
    --stamp:#A8331F;
    --stamp-soft:#A8331F1a;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--stamp-soft);}

  .wrap{
    max-width:560px;
    margin:0 auto;
    padding:64px 24px 96px;
  }

  .brand{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:56px;
  }
  .brand-mark{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:22px;
    letter-spacing:-0.01em;
    cursor:pointer;
  }
  .brand-mark span{color:var(--stamp);}
  .brand-sub{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--ink-soft);
    letter-spacing:0.04em;
  }

  h1{
    font-family:'Fraunces',serif;
    font-weight:500;
    font-style:italic;
    font-size:36px;
    line-height:1.15;
    letter-spacing:-0.01em;
    margin:0 0 8px;
  }
  .lede{
    color:var(--ink-soft);
    font-size:15px;
    line-height:1.5;
    margin:0 0 40px;
    max-width:44ch;
  }

  label.field-label{
    display:block;
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--ink-soft);
    margin-bottom:8px;
  }

  input[type=text]{
    width:100%;
    background:transparent;
    border:none;
    border-bottom:1.5px solid var(--line);
    padding:10px 2px;
    font-family:'Inter',sans-serif;
    font-size:16px;
    color:var(--ink);
    outline:none;
    transition:border-color .15s ease;
  }
  input[type=text]:focus{border-bottom-color:var(--ink);}
  input[type=text]::placeholder{color:#B8B2A0;}

  .field{margin-bottom:26px;}

  .option-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:12px;
  }
  .option-row input{flex:1;}
  .option-num{
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    color:var(--ink-soft);
    width:16px;
  }
  .remove-opt{
    background:none;
    border:none;
    color:var(--ink-soft);
    font-size:18px;
    cursor:pointer;
    line-height:1;
    padding:4px;
    opacity:0.6;
  }
  .remove-opt:hover{opacity:1;color:var(--stamp);}

  .add-opt{
    background:none;
    border:none;
    color:var(--ink-soft);
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    letter-spacing:0.03em;
    cursor:pointer;
    padding:6px 0;
    margin-bottom:32px;
    border-bottom:1px dashed transparent;
  }
  .add-opt:hover{color:var(--ink);border-bottom-color:var(--ink-soft);}

  button.primary{
    background:var(--ink);
    color:var(--paper);
    border:none;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:14px;
    letter-spacing:0.01em;
    padding:14px 26px;
    cursor:pointer;
    transition:transform .12s ease, background .15s ease;
  }
  button.primary:hover{background:#3a3730;}
  button.primary:active{transform:scale(0.98);}
  button.primary:disabled{opacity:0.4;cursor:default;}

  button.ghost{
    background:none;
    border:1.5px solid var(--line);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    font-weight:500;
    font-size:13px;
    padding:10px 18px;
    cursor:pointer;
    transition:border-color .15s ease;
  }
  button.ghost:hover{border-color:var(--ink);}

  .divider{
    border:none;
    border-top:1px solid var(--line);
    margin:48px 0;
  }

  .recent-item{
    display:block;
    padding:16px 0;
    border-bottom:1px solid var(--line);
    text-decoration:none;
    color:var(--ink);
    cursor:pointer;
  }
  .recent-item:first-of-type{border-top:1px solid var(--line);}
  .recent-q{
    font-family:'Fraunces',serif;
    font-size:17px;
    margin-bottom:4px;
  }
  .recent-meta{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--ink-soft);
  }
  .empty-note{
    color:var(--ink-soft);
    font-size:13px;
    font-style:italic;
    padding:20px 0;
  }

  /* Poll view */
  .poll-question{
    font-family:'Fraunces',serif;
    font-weight:500;
    font-size:30px;
    line-height:1.2;
    letter-spacing:-0.01em;
    margin:0 0 6px;
  }
  .poll-meta{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--ink-soft);
    margin-bottom:36px;
  }

  .ballot-line{
    position:relative;
    display:flex;
    align-items:center;
    gap:14px;
    padding:16px 4px;
    border-bottom:1px solid var(--line);
    cursor:pointer;
    transition:background .12s ease;
  }
  .ballot-line:hover{background:var(--paper-dim);}
  .ballot-box{
    width:20px;
    height:20px;
    border:1.5px solid var(--ink-soft);
    flex-shrink:0;
    position:relative;
  }
  .ballot-line.picked .ballot-box{border-color:var(--stamp);}
  .ballot-box svg{
    position:absolute;top:-3px;left:-2px;
    opacity:0;
    transition:opacity .1s ease;
  }
  .ballot-line.picked .ballot-box svg{opacity:1;}
  .ballot-text{
    font-size:16px;
    flex:1;
  }

  .results-line{
    padding:14px 4px 18px;
    border-bottom:1px solid var(--line);
    position:relative;
  }
  .results-top{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:8px;
  }
  .results-text{
    font-size:15.5px;
    font-weight:500;
  }
  .results-text.mine::after{
    content:'— your pick';
    font-family:'JetBrains Mono',monospace;
    font-weight:400;
    font-size:10.5px;
    color:var(--stamp);
    margin-left:8px;
    text-transform:uppercase;
    letter-spacing:0.03em;
  }
  .results-pct{
    font-family:'JetBrains Mono',monospace;
    font-size:13px;
    color:var(--ink-soft);
  }
  .bar-track{
    height:6px;
    background:var(--paper-dim);
    width:100%;
    overflow:hidden;
  }
  .bar-fill{
    height:100%;
    background:var(--ink);
    width:0%;
    transition:width .5s cubic-bezier(.2,.8,.2,1);
  }
  .results-line.mine .bar-fill{background:var(--stamp);}

  .vote-cta{
    margin-top:8px;
  }

  .stamp-mark{
    position:absolute;
    right:0;
    top:8px;
    width:56px;
    height:56px;
    pointer-events:none;
    opacity:0;
    transform:rotate(-12deg) scale(0.6);
    transition:opacity .3s ease, transform .35s cubic-bezier(.34,1.56,.64,1);
  }
  .stamp-mark.show{
    opacity:0.9;
    transform:rotate(-12deg) scale(1);
  }

  .share-box{
    display:flex;
    gap:8px;
    margin-top:28px;
    align-items:center;
  }
  .share-box input{
    flex:1;
    background:var(--paper-dim);
    border:1px solid var(--line);
    padding:10px 12px;
    font-family:'JetBrains Mono',monospace;
    font-size:12.5px;
    color:var(--ink-soft);
  }

  .totals{
    font-family:'JetBrains Mono',monospace;
    font-size:11.5px;
    color:var(--ink-soft);
    margin-top:24px;
  }

  .back-link{
    display:inline-block;
    font-family:'JetBrains Mono',monospace;
    font-size:11.5px;
    color:var(--ink-soft);
    text-decoration:none;
    margin-bottom:32px;
    cursor:pointer;
  }
  .back-link:hover{color:var(--ink);}

  .toast{
    position:fixed;
    bottom:28px;
    left:50%;
    transform:translateX(-50%) translateY(12px);
    background:var(--ink);
    color:var(--paper);
    font-size:13px;
    padding:10px 20px;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s ease, transform .2s ease;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .loading{
    color:var(--ink-soft);
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
  }

  @media (max-width:480px){
    .wrap{padding:40px 18px 80px;}
    h1{font-size:28px;}
    .poll-question{font-size:24px;}
  }

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;}
  }
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="brand">
    <div class="brand-mark" onclick="goHome()">ballot<span>.</span></div>
    <div class="brand-sub">open polls</div>
  </div>
  <div id="content"><div class="loading">loading…</div></div>
</div>
<div class="toast" id="toast"></div>

<script>
const content = document.getElementById('toast') ? document.getElementById('content') : null;
const toastEl = document.getElementById('toast');

function showToast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  setTimeout(()=>toastEl.classList.remove('show'), 1800);
}

function esc(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function genId(){
  return Math.random().toString(36).slice(2,8) + Math.random().toString(36).slice(2,5);
}

async function getName(){
  try{
    const r = await window.storage.get('profile:name', false);
    return r ? r.value : '';
  }catch(e){ return ''; }
}
async function setName(name){
  try{ await window.storage.set('profile:name', name, false); }catch(e){}
}

async function getIndex(){
  try{
    const r = await window.storage.get('polls:index', true);
    return r ? JSON.parse(r.value) : [];
  }catch(e){ return []; }
}
async function saveIndex(list){
  try{ await window.storage.set('polls:index', JSON.stringify(list), true); }catch(e){}
}

async function getPoll(id){
  try{
    const r = await window.storage.get('poll:'+id, true);
    return r ? JSON.parse(r.value) : null;
  }catch(e){ return null; }
}
async function savePoll(id, data){
  try{ await window.storage.set('poll:'+id, JSON.stringify(data), true); return true; }catch(e){ return false; }
}

function goHome(){
  location.hash = '';
}
function goPoll(id){
  location.hash = 'poll=' + id;
}

window.addEventListener('hashchange', route);
window.addEventListener('DOMContentLoaded', route);

async function route(){
  const hash = location.hash.replace('#','');
  if(hash.startsWith('poll=')){
    renderPoll(hash.slice(5));
  } else {
    renderHome();
  }
}

// ---------- HOME ----------
async function renderHome(){
  const content = document.getElementById('content');
  content.innerHTML = '<div class="loading">loading…</div>';
  const savedName = await getName();
  const index = await getIndex();

  content.innerHTML = `
    <h1>Make a poll,<br>share the link.</h1>
    <p class="lede">No login. Put your name, ask a question, give people the link — they vote, you watch the count move.</p>

    <div class="field">
      <label class="field-label">Your name</label>
      <input type="text" id="creatorName" placeholder="e.g. Noel" value="${esc(savedName||'')}">
    </div>

    <div class="field">
      <label class="field-label">Question</label>
      <input type="text" id="question" placeholder="e.g. Which venue for the meetup?">
    </div>

    <div id="optionsWrap"></div>
    <button class="add-opt" onclick="addOption()">+ add option</button>
    <br>
    <button class="primary" onclick="createPoll()">Create poll →</button>

    <hr class="divider">

    <label class="field-label">Recent polls</label>
    <div id="recentList"></div>
  `;

  const optWrap = document.getElementById('optionsWrap');
  optWrap.innerHTML = '';
  addOptionRow('');
  addOptionRow('');

  const recentList = document.getElementById('recentList');
  if(index.length === 0){
    recentList.innerHTML = '<div class="empty-note">No polls yet — be the first to make one.</div>';
  } else {
    const sorted = [...index].sort((a,b)=> b.createdAt - a.createdAt).slice(0,12);
    recentList.innerHTML = sorted.map(p => `
      <a class="recent-item" onclick="goPoll('${p.id}')">
        <div class="recent-q">${esc(p.question)}</div>
        <div class="recent-meta">by ${esc(p.creator)} · ${timeAgo(p.createdAt)}</div>
      </a>
    `).join('');
  }
}

function addOptionRow(val){
  const optWrap = document.getElementById('optionsWrap');
  const row = document.createElement('div');
  row.className = 'option-row';
  const n = optWrap.children.length + 1;
  row.innerHTML = `
    <span class="option-num">${n}</span>
    <input type="text" class="opt-input" placeholder="Option ${n}" value="${esc(val||'')}">
    <button class="remove-opt" onclick="this.parentElement.remove(); renumber();" title="remove">×</button>
  `;
  optWrap.appendChild(row);
}
function addOption(){
  const optWrap = document.getElementById('optionsWrap');
  if(optWrap.children.length >= 10){ showToast('10 options is the cap'); return; }
  addOptionRow('');
}
function renumber(){
  const rows = document.querySelectorAll('#optionsWrap .option-row');
  rows.forEach((r,i)=>{
    r.querySelector('.option-num').textContent = i+1;
    r.querySelector('input').placeholder = 'Option ' + (i+1);
  });
}

async function createPoll(){
  const nameEl = document.getElementById('creatorName');
  const qEl = document.getElementById('question');
  const name = nameEl.value.trim();
  const question = qEl.value.trim();
  const opts = [...document.querySelectorAll('.opt-input')]
    .map(i => i.value.trim())
    .filter(Boolean);

  if(!name){ showToast('Add your name first'); nameEl.focus(); return; }
  if(!question){ showToast('Add a question'); qEl.focus(); return; }
  if(opts.length < 2){ showToast('Add at least 2 options'); return; }

  const btn = event.target;
  btn.disabled = true;
  btn.textContent = 'Creating…';

  await setName(name);

  const id = genId();
  const poll = {
    id,
    question,
    creator: name,
    options: opts,
    votes: opts.map(()=>0),
    voters: {},
    createdAt: Date.now()
  };
  await savePoll(id, poll);

  const index = await getIndex();
  index.push({id, question, creator: name, createdAt: poll.createdAt});
  await saveIndex(index);

  goPoll(id);
}

function timeAgo(ts){
  const s = Math.floor((Date.now()-ts)/1000);
  if(s < 60) return 'just now';
  if(s < 3600) return Math.floor(s/60)+'m ago';
  if(s < 86400) return Math.floor(s/3600)+'h ago';
  return Math.floor(s/86400)+'d ago';
}

// ---------- POLL VIEW ----------
let currentPollId = null;
let selectedOption = null;

async function renderPoll(id){
  currentPollId = id;
  selectedOption = null;
  const content = document.getElementById('content');
  content.innerHTML = '<div class="loading">loading poll…</div>';

  const poll = await getPoll(id);
  if(!poll){
    content.innerHTML = `
      <a class="back-link" onclick="goHome()">← back</a>
      <h1>Poll not found</h1>
      <p class="lede">This link doesn't point to a poll that exists here anymore.</p>
      <button class="primary" onclick="goHome()">Make your own</button>
    `;
    return;
  }

  const savedName = await getName();
  const myVoteName = savedName ? Object.keys(poll.voters).find(n => n.toLowerCase() === savedName.toLowerCase()) : null;
  const hasVoted = !!myVoteName;

  content.innerHTML = `
    <a class="back-link" onclick="goHome()">← all polls</a>
    <div class="poll-question">${esc(poll.question)}</div>
    <div class="poll-meta">by ${esc(poll.creator)} · ${timeAgo(poll.createdAt)}</div>
    <div id="pollBody"></div>
  `;

  const body = document.getElementById('pollBody');

  if(hasVoted){
    renderResults(body, poll, myVoteName);
  } else {
    renderVoteForm(body, poll, savedName);
  }

  renderShare(id, poll);
}

function renderVoteForm(body, poll, savedName){
  body.innerHTML = `
    <div class="field" style="margin-top:8px;">
      <label class="field-label">Your name</label>
      <input type="text" id="voterName" placeholder="e.g. Priya" value="${esc(savedName||'')}">
    </div>
    <div id="ballotOptions"></div>
    <div class="vote-cta">
      <button class="primary" id="submitVote" disabled onclick="submitVote()">Cast vote</button>
    </div>
    <div class="totals">${poll.votes.reduce((a,b)=>a+b,0)} vote(s) so far</div>
  `;
  const ballotWrap = document.getElementById('ballotOptions');
  poll.options.forEach((opt, i) => {
    const line = document.createElement('div');
    line.className = 'ballot-line';
    line.onclick = () => pickOption(i);
    line.innerHTML = `
      <div class="ballot-box" id="box-${i}">
        <svg width="24" height="24" viewBox="0 0 24 24"><path d="M5 12l5 5L19 7" stroke="#A8331F" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div class="ballot-text">${esc(opt)}</div>
    `;
    ballotWrap.appendChild(line);
  });
}

function pickOption(i){
  selectedOption = i;
  document.querySelectorAll('.ballot-line').forEach((el, idx) => {
    el.classList.toggle('picked', idx === i);
  });
  document.getElementById('submitVote').disabled = false;
}

async function submitVote(){
  const nameEl = document.getElementById('voterName');
  const name = nameEl.value.trim();
  if(!name){ showToast('Add your name to vote'); nameEl.focus(); return; }
  if(selectedOption === null){ showToast('Pick an option first'); return; }

  const btn = document.getElementById('submitVote');
  btn.disabled = true;
  btn.textContent = 'Casting…';

  await setName(name);

  // Re-fetch latest to avoid clobbering concurrent votes
  const poll = await getPoll(currentPollId);
  if(!poll){ showToast('Poll disappeared'); return; }

  const existing = Object.keys(poll.voters).find(n => n.toLowerCase() === name.toLowerCase());
  if(existing){
    showToast('This name already voted here');
    renderPoll(currentPollId);
    return;
  }

  poll.votes[selectedOption] = (poll.votes[selectedOption]||0) + 1;
  poll.voters[name] = selectedOption;
  const ok = await savePoll(currentPollId, poll);

  if(!ok){ showToast('Could not save your vote — try again'); btn.disabled=false; btn.textContent='Cast vote'; return; }

  const body = document.getElementById('pollBody');
  renderResults(body, poll, name, true);
}

function renderResults(body, poll, myName, justVoted){
  const total = poll.votes.reduce((a,b)=>a+b,0) || 1;
  body.innerHTML = `
    <div id="resultsWrap" style="margin-top:8px;"></div>
    <div class="totals">${poll.votes.reduce((a,b)=>a+b,0)} vote(s) total</div>
  `;
  const wrap = document.getElementById('resultsWrap');
  const myIdx = poll.voters[myName];

  poll.options.forEach((opt, i) => {
    const pct = Math.round((poll.votes[i]/total)*100);
    const isMine = i === myIdx;
    const line = document.createElement('div');
    line.className = 'results-line' + (isMine ? ' mine' : '');
    line.innerHTML = `
      ${isMine && justVoted ? stampSVG() : ''}
      <div class="results-top">
        <div class="results-text${isMine ? ' mine' : ''}">${esc(opt)}</div>
        <div class="results-pct">${pct}% · ${poll.votes[i]}</div>
      </div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
    `;
    wrap.appendChild(line);
  });

  if(justVoted){
    setTimeout(()=>{
      const stamps = wrap.querySelectorAll('.stamp-mark');
      stamps.forEach(s => s.classList.add('show'));
    }, 60);
  }
}

function stampSVG(){
  return `<svg class="stamp-mark" viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="42" fill="none" stroke="#A8331F" stroke-width="4"/>
    <text x="50" y="46" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700" fill="#A8331F">VOTED</text>
    <text x="50" y="62" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8" fill="#A8331F">✓</text>
  </svg>`;
}

function renderShare(id, poll){
  const content = document.getElementById('content');
  const url = location.origin + location.pathname + '#poll=' + id;
  const shareDiv = document.createElement('div');
  shareDiv.className = 'share-box';
  shareDiv.innerHTML = `
    <input type="text" readonly value="${esc(url)}" id="shareUrl" onclick="this.select()">
    <button class="ghost" onclick="copyShare()">Copy link</button>
  `;
  content.appendChild(shareDiv);
}

async function copyShare(){
  const input = document.getElementById('shareUrl');
  input.select();
  try{
    await navigator.clipboard.writeText(input.value);
    showToast('Link copied');
  }catch(e){
    try{
      document.execCommand('copy');
      showToast('Link copied');
    }catch(e2){
      showToast('Select the link and copy manually');
    }
  }
}
</script>
</body>
</html>
