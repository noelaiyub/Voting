<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pitch Vote — live board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFF7EC;
    --ink:#2B2118;
    --ink-soft:#8A7B6C;
    --card-line:#2B2118;
    --pink:#FF3E6C;
    --yellow:#FFD166;
    --coral:#FF7B54;
    --mint:#3FC7A9;
    --sky:#4FB8E8;
    --lav:#A78BFA;
    --gold:#FFC93C;
    --cream-card:#FFFFFF;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 8% 12%, #FFE8D1 0%, transparent 40%),
      radial-gradient(circle at 92% 85%, #D6F5EC 0%, transparent 45%),
      var(--bg);
    background-attachment:fixed;
    color:var(--ink);
    font-family:'Poppins',sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:#FFD166;}

  .wrap{
    max-width:920px;
    margin:0 auto;
    padding:36px 20px 100px;
  }

  /* Header */
  .header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:14px;
    margin-bottom:28px;
  }
  .title-block h1{
    font-family:'Baloo 2',sans-serif;
    font-weight:800;
    font-size:38px;
    line-height:1;
    margin:0 0 4px;
    letter-spacing:-0.01em;
  }
  .title-block .sub{
    font-size:13.5px;
    color:var(--ink-soft);
    font-weight:500;
  }
  .live-pill{
    display:flex;
    align-items:center;
    gap:7px;
    background:var(--ink);
    color:#fff;
    padding:8px 16px;
    border-radius:999px;
    font-family:'Baloo 2',sans-serif;
    font-weight:600;
    font-size:13px;
    box-shadow:3px 3px 0 var(--pink);
  }
  .live-dot{
    width:8px;height:8px;border-radius:50%;
    background:#4CFF6E;
    animation:pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{opacity:1; transform:scale(1);}
    50%{opacity:0.4; transform:scale(0.7);}
  }

  /* Name gate */
  .name-card{
    background:var(--cream-card);
    border:3px solid var(--ink);
    border-radius:20px;
    padding:22px 24px;
    margin-bottom:28px;
    box-shadow:5px 5px 0 var(--yellow);
    transform:rotate(-0.4deg);
  }
  .name-card .lbl{
    font-family:'Baloo 2',sans-serif;
    font-weight:700;
    font-size:16px;
    margin-bottom:10px;
    display:block;
  }
  .name-row{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
  }
  input[type=text]{
    font-family:'Poppins',sans-serif;
    font-size:15px;
    padding:11px 14px;
    border:2.5px solid var(--ink);
    border-radius:12px;
    outline:none;
    background:#fff;
    color:var(--ink);
    transition:box-shadow .15s ease;
  }
  input[type=text]:focus{box-shadow:0 0 0 3px #FFD16680;}
  input[type=text]::placeholder{color:#B8AC9C;}
  #nameInput{flex:1; min-width:180px;}

  .btn{
    font-family:'Baloo 2',sans-serif;
    font-weight:700;
    font-size:14.5px;
    border:2.5px solid var(--ink);
    border-radius:12px;
    padding:11px 20px;
    cursor:pointer;
    transition:transform .1s ease, box-shadow .1s ease;
    background:var(--yellow);
    color:var(--ink);
    box-shadow:3px 3px 0 var(--ink);
  }
  .btn:hover{transform:translate(-1px,-1px); box-shadow:4px 4px 0 var(--ink);}
  .btn:active{transform:translate(1px,1px); box-shadow:1px 1px 0 var(--ink);}
  .btn:disabled{opacity:0.45; cursor:default; transform:none; box-shadow:3px 3px 0 var(--ink);}
  .btn.pink{background:var(--pink); color:#fff;}
  .btn.mint{background:var(--mint); color:#fff;}
  .btn.small{padding:9px 16px; font-size:13px;}

  .you-are{
    font-size:13px;
    color:var(--ink-soft);
    margin-top:10px;
  }
  .you-are b{color:var(--ink);}
  .change-name{
    background:none;border:none;color:var(--pink);
    font-weight:600;font-size:12.5px;cursor:pointer;
    text-decoration:underline;padding:0;margin-left:4px;
  }

  /* Add pitcher */
  .add-row{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:32px;
  }
  #pitcherInput{flex:1; min-width:200px;}

  /* Board grid */
  .board-heading{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:16px;
  }
  .board-heading h2{
    font-family:'Baloo 2',sans-serif;
    font-size:20px;
    margin:0;
  }
  .total-votes{
    font-size:12.5px;
    color:var(--ink-soft);
    font-weight:500;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(230px, 1fr));
    gap:18px;
  }

  .card{
    position:relative;
    background:#fff;
    border:3px solid var(--ink);
    border-radius:18px;
    padding:20px 18px 18px;
    cursor:pointer;
    transition:transform .15s ease, box-shadow .15s ease;
    overflow:visible;
  }
  .card:hover{transform:translateY(-3px);}
  .card:active{transform:translateY(-1px) scale(0.98);}

  .card.rank-0{ transform:rotate(-1deg); }
  .card.rank-1{ transform:rotate(0.8deg); }
  .card.rank-2{ transform:rotate(-0.6deg); }
  .card.rank-0:hover{ transform:rotate(-1deg) translateY(-3px); }
  .card.rank-1:hover{ transform:rotate(0.8deg) translateY(-3px); }
  .card.rank-2:hover{ transform:rotate(-0.6deg) translateY(-3px); }

  .card.mine{
    outline:none;
    box-shadow:0 0 0 3px var(--ink), 6px 6px 0 var(--pink) !important;
  }

  .crown{
    position:absolute;
    top:-20px;
    left:50%;
    transform:translateX(-50%) rotate(-8deg);
    font-size:26px;
    filter:drop-shadow(0 2px 0 rgba(0,0,0,0.15));
  }
  .medal{
    position:absolute;
    top:-14px;
    right:-8px;
    font-size:20px;
  }

  .pitcher-name{
    font-family:'Baloo 2',sans-serif;
    font-weight:700;
    font-size:18px;
    margin-bottom:12px;
    word-break:break-word;
    padding-right:4px;
  }

  .vote-count{
    font-family:'Baloo 2',sans-serif;
    font-weight:800;
    font-size:34px;
    line-height:1;
    margin-bottom:2px;
  }
  .vote-label{
    font-size:11px;
    color:var(--ink-soft);
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:0.04em;
    margin-bottom:12px;
  }

  .bar-track{
    height:9px;
    background:#F1ECE3;
    border-radius:6px;
    overflow:hidden;
    border:1.5px solid var(--ink);
    margin-bottom:14px;
  }
  .bar-fill{
    height:100%;
    width:0%;
    border-radius:6px;
    transition:width .5s cubic-bezier(.2,.8,.2,1);
  }

  .vote-btn{
    width:100%;
    text-align:center;
    font-family:'Baloo 2',sans-serif;
    font-weight:700;
    font-size:13.5px;
    border-radius:10px;
    padding:9px;
    border:2px solid var(--ink);
    cursor:pointer;
  }
  .vote-btn.unvoted{background:var(--ink); color:#fff;}
  .vote-btn.voted{background:#fff; color:var(--ink);}

  .empty-board{
    text-align:center;
    padding:50px 20px;
    color:var(--ink-soft);
    font-size:14px;
  }
  .empty-board .big{
    font-size:38px;
    margin-bottom:10px;
  }

  .toast{
    position:fixed;
    bottom:26px;
    left:50%;
    transform:translateX(-50%) translateY(14px);
    background:var(--ink);
    color:#fff;
    font-family:'Baloo 2',sans-serif;
    font-weight:600;
    font-size:13.5px;
    padding:11px 22px;
    border-radius:999px;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s ease, transform .2s ease;
    z-index:50;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  .confetti-piece{
    position:absolute;
    width:7px;height:7px;
    border-radius:2px;
    pointer-events:none;
    animation:burst .7s ease-out forwards;
  }
  @keyframes burst{
    0%{opacity:1; transform:translate(0,0) rotate(0deg);}
    100%{opacity:0; transform:var(--end) rotate(360deg);}
  }

  .loading{
    color:var(--ink-soft);
    font-family:'Baloo 2',sans-serif;
    font-size:14px;
    padding:30px 0;
  }

  @media (max-width:480px){
    .title-block h1{font-size:30px;}
    .wrap{padding:26px 14px 90px;}
  }

  @media (prefers-reduced-motion: reduce){
    *{animation:none !important; transition:none !important;}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="title-block">
      <h1>🎤 Pitch Vote</h1>
      <div class="sub">Click a card to cast your vote — updates live for everyone</div>
    </div>
    <div class="live-pill"><span class="live-dot"></span>LIVE</div>
  </div>

  <div id="nameGate"></div>
  <div id="addPitcherWrap"></div>

  <div class="board-heading">
    <h2>The board</h2>
    <div class="total-votes" id="totalVotes"></div>
  </div>
  <div id="board"><div class="loading">loading board…</div></div>
</div>
<div class="toast" id="toast"></div>

<script>
const CARD_COLORS = ['#FFD166','#FF7B54','#4FB8E8','#A78BFA','#3FC7A9','#FF3E6C'];
const toastEl = document.getElementById('toast');
let myName = '';
let pollTimer = null;

function esc(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}
function showToast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  setTimeout(()=>toastEl.classList.remove('show'), 1700);
}
function genId(){
  return Math.random().toString(36).slice(2,9);
}

async function getName(){
  try{
    const r = await window.storage.get('profile:name', false);
    return r ? r.value : '';
  }catch(e){ return ''; }
}
async function setName(name){
  try{ await window.storage.set('profile:name', name, false); }catch(e){}
}

async function getBoard(){
  try{
    const r = await window.storage.get('board:main', true);
    return r ? JSON.parse(r.value) : null;
  }catch(e){ return null; }
}
async function saveBoard(data){
  try{ await window.storage.set('board:main', JSON.stringify(data), true); return true; }
  catch(e){ return false; }
}
async function ensureBoard(){
  let b = await getBoard();
  if(!b){
    b = { pitchers: [], voters: {}, createdAt: Date.now() };
    await saveBoard(b);
  }
  return b;
}

async function init(){
  myName = await getName();
  renderNameGate();
  renderAddPitcher();
  await refreshBoard();
  pollTimer = setInterval(refreshBoard, 3500);
}
window.addEventListener('DOMContentLoaded', init);

function renderNameGate(){
  const gate = document.getElementById('nameGate');
  if(myName){
    gate.innerHTML = `
      <div class="you-are">Voting as <b>${esc(myName)}</b><button class="change-name" onclick="clearName()">change</button></div>
    `;
  } else {
    gate.innerHTML = `
      <div class="name-card">
        <span class="lbl">👋 What's your name?</span>
        <div class="name-row">
          <input type="text" id="nameInput" placeholder="Enter your name to vote">
          <button class="btn pink" onclick="confirmName()">I'm in</button>
        </div>
      </div>
    `;
  }
}
async function confirmName(){
  const input = document.getElementById('nameInput');
  const name = input.value.trim();
  if(!name){ showToast('Type your name first'); input.focus(); return; }
  myName = name;
  await setName(name);
  renderNameGate();
  await refreshBoard();
  showToast(`Welcome, ${name} 🎉`);
}
function clearName(){
  myName = '';
  renderNameGate();
  refreshBoard();
}

function renderAddPitcher(){
  const wrap = document.getElementById('addPitcherWrap');
  wrap.innerHTML = `
    <div class="add-row">
      <input type="text" id="pitcherInput" placeholder="Add a new pitch / pitcher name…">
      <button class="btn mint" onclick="addPitcher()">+ Add to board</button>
    </div>
  `;
}
async function addPitcher(){
  const input = document.getElementById('pitcherInput');
  const name = input.value.trim();
  if(!name){ showToast('Enter a pitcher name'); input.focus(); return; }

  const board = await ensureBoard();
  const dup = board.pitchers.find(p => p.name.toLowerCase() === name.toLowerCase());
  if(dup){ showToast('Already on the board'); return; }

  board.pitchers.push({ id: genId(), name, votes: 0 });
  const ok = await saveBoard(board);
  if(ok){
    input.value = '';
    showToast(`${name} added to the board`);
    await refreshBoard();
  } else {
    showToast('Could not add — try again');
  }
}

let lastRenderKey = '';

async function refreshBoard(){
  const board = await getBoard();
  const boardEl = document.getElementById('board');
  const totalEl = document.getElementById('totalVotes');

  if(!board || board.pitchers.length === 0){
    boardEl.innerHTML = `
      <div class="empty-board">
        <div class="big">🎬</div>
        No pitchers on the board yet.<br>Add the first one above.
      </div>
    `;
    totalEl.textContent = '';
    lastRenderKey = '';
    return;
  }

  const totalVotes = board.pitchers.reduce((a,p)=>a+p.votes,0);
  const maxVotes = Math.max(...board.pitchers.map(p=>p.votes), 1);
  totalEl.textContent = totalVotes + ' vote' + (totalVotes===1?'':'s') + ' cast';

  const myVoteFor = myName ? board.voters[Object.keys(board.voters).find(n=>n.toLowerCase()===myName.toLowerCase())] : undefined;

  const sorted = [...board.pitchers].sort((a,b)=> b.votes - a.votes);

  const renderKey = JSON.stringify(sorted.map(p=>[p.id,p.votes])) + '|' + myName;
  if(renderKey === lastRenderKey) return; // avoid disrupting hover state on no-op polls
  lastRenderKey = renderKey;

  boardEl.innerHTML = '';
  const grid = document.createElement('div');
  grid.className = 'grid';

  sorted.forEach((p, i) => {
    const pct = Math.round((p.votes / maxVotes) * 100);
    const isMine = p.id === myVoteFor;
    const color = CARD_COLORS[i % CARD_COLORS.length];
    const card = document.createElement('div');
    card.className = `card rank-${i % 3}` + (isMine ? ' mine' : '');
    card.onclick = (ev) => castVote(p.id, ev);
    card.innerHTML = `
      ${i===0 && p.votes>0 ? '<div class="crown">👑</div>' : ''}
      ${i===1 && p.votes>0 ? '<div class="medal">🥈</div>' : ''}
      ${i===2 && p.votes>0 ? '<div class="medal">🥉</div>' : ''}
      <div class="pitcher-name">${esc(p.name)}</div>
      <div class="vote-count">${p.votes}</div>
      <div class="vote-label">vote${p.votes===1?'':'s'}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%; background:${color};"></div></div>
      <div class="vote-btn ${isMine?'voted':'unvoted'}">${isMine ? '✓ Your vote' : 'Vote'}</div>
    `;
    grid.appendChild(card);
  });

  boardEl.appendChild(grid);
}

async function castVote(pitcherId, ev){
  if(!myName){
    showToast('Enter your name first ☝️');
    document.getElementById('nameInput')?.focus();
    return;
  }

  const board = await getBoard();
  if(!board) return;

  const existingNameKey = Object.keys(board.voters).find(n => n.toLowerCase() === myName.toLowerCase());
  const prevPitcherId = existingNameKey ? board.voters[existingNameKey] : null;

  if(prevPitcherId === pitcherId){
    showToast('Already your pick');
    return;
  }

  if(prevPitcherId){
    const prev = board.pitchers.find(p => p.id === prevPitcherId);
    if(prev) prev.votes = Math.max(0, prev.votes - 1);
  }
  const target = board.pitchers.find(p => p.id === pitcherId);
  if(!target) return;
  target.votes += 1;
  board.voters[myName] = pitcherId;

  const ok = await saveBoard(board);
  if(!ok){ showToast('Vote failed — try again'); return; }

  burstConfetti(ev.currentTarget);
  lastRenderKey = '';
  await refreshBoard();
  showToast(`Voted for ${target.name} 🎉`);
}

function burstConfetti(cardEl){
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const rect = cardEl.getBoundingClientRect();
  const colors = ['#FF3E6C','#FFD166','#4FB8E8','#3FC7A9','#A78BFA'];
  for(let i=0;i<14;i++){
    const p = document.createElement('div');
    p.className = 'confetti-piece';
    const angle = Math.random()*Math.PI*2;
    const dist = 40 + Math.random()*50;
    const ex = Math.cos(angle)*dist;
    const ey = Math.sin(angle)*dist - 20;
    p.style.setProperty('--end', `translate(${ex}px, ${ey}px)`);
    p.style.background = colors[i % colors.length];
    p.style.left = (rect.left + rect.width/2 + window.scrollX) + 'px';
    p.style.top = (rect.top + rect.height/2 + window.scrollY) + 'px';
    document.body.appendChild(p);
    setTimeout(()=>p.remove(), 750);
  }
}
</script>
</body>
</html>
